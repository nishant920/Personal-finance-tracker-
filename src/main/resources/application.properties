spring.application.name=finance

# Server
server.port=8080

# Datasource (env vars - set these in Docker/EC2, not hardcoded)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finance-track}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT secret (env var)
jwt.secret=${JWT_SECRET:change-this-in-prod-please}
jwt.expiration=86400000